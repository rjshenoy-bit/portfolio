<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <!-- Seamless tile: grid lines drawn at 0/40/80/120 only (160 = next tile's 0) -->
  <g stroke="#3A4656" stroke-width="1" opacity="0.35">
    <line x1="0" y1="0" x2="160" y2="0"/>
    <line x1="0" y1="40" x2="160" y2="40"/>
    <line x1="0" y1="80" x2="160" y2="80"/>
    <line x1="0" y1="120" x2="160" y2="120"/>
    <line x1="0" y1="0" x2="0" y2="160"/>
    <line x1="40" y1="0" x2="40" y2="160"/>
    <line x1="80" y1="0" x2="80" y2="160"/>
    <line x1="120" y1="0" x2="120" y2="160"/>
  </g>
  <!-- Sparse data-point accents at grid intersections, one per accent color -->
  <circle cx="40" cy="40" r="2.6" fill="#4A90E2" opacity="0.45"/>
  <circle cx="120" cy="80" r="2.6" fill="#35C97F" opacity="0.4"/>
  <circle cx="80" cy="120" r="2.6" fill="#E8B34F" opacity="0.4"/>
  <circle cx="0" cy="80" r="2.2" fill="#4A90E2" opacity="0.3"/>
</svg>
